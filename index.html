  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function weekdayCN(d = new Date()) { return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]; }
function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

function autoFixDuplicateUnits() {
  let totalFixed = 0;
  state.lists.forEach(list => {
    // 找出所有"全部"变体：全部、全部词、全部词_xxx、全部词 xxx
    const variants = list.units.filter(u =>
      u.name === '全部' ||
      u.name === '全部词' ||
      /^全部词[_\s]/.test(u.name)
    );
    
    if (variants.length === 0) return;
    
    // 如果只有一个，且已经是"全部词"→ 无需处理（幂等）
    if (variants.length === 1 && variants[0].name === '全部词') return;
    
    // 合并所有变体的 wordIds
    const mergedIds = new Set();
    variants.forEach(u => u.wordIds.forEach(id => mergedIds.add(id)));
    
    // 保留第一个，改名为"全部词"
    const keep = variants[0];
    keep.name = '全部词';
    keep.wordIds = Array.from(mergedIds);
    
    // 删除其他变体
    const removedIds = variants.slice(1).map(u => u.id);
    list.units = list.units.filter(u => !removedIds.includes(u.id));
    
    // 修复 activeUnitId
    if (removedIds.includes(state.activeUnitId)) {
      state.activeUnitId = keep.id;
    }
    
    totalFixed += variants.length - 1;
  });
  
  if (totalFixed > 0) {
    saveState();
    console.log(`[单词星球] 合并了 ${totalFixed} 个重复的"全部"变体`);
  }
}

const SYL_VOWELS = new Set(['a','e','i','o','u']);
const SYL_VOWEL_TEAMS = new Set(['ai','ay','ea','ee','ei','ey','ie','oa','oe','oo','ou','ow','oy','oi','au','aw','ew','eu','ui','ue','igh','eigh','ough','augh','eau','air','are','ear','eer','eir','oar','oor','ore','our','ire','ure']);

function findVowelGroups(w) {
  const groups = []; let i = 0; const n = w.length;
  while (i < n) {
    if (SYL_VOWELS.has(w[i])) {
      let j = i + 1;
      while (j < n && SYL_VOWELS.has(w[j])) j++;
      let end = i + 1;
      for (let len = j - i; len >= 2; len--) {
        const chunk = w.slice(i, i + len);
        if (SYL_VOWEL_TEAMS.has(chunk)) { end = i + len; break; }
      }
      groups.push({ start: i, end: end });
      i = end;
    } else i++;
  }
  return groups;
}

function autoSyllabify(word) {
  if (!word) return [word];
  const original = String(word).trim();
  if (!original) return [original];
  if (original.includes('.')) return [original];
  if (original.includes(' ') || original.includes('-')) {
    const parts = original.split(/[-\s]+/).filter(Boolean);
    const result = [];
    parts.forEach(p => result.push(...autoSyllabify(p)));
    return result.length ? result : [original];
  }
  const w = original.toLowerCase();
  const n = w.length;
  if (SYL_OVERRIDES[w]) return SYL_OVERRIDES[w].slice();
  if (n <= 3) return [original];
  let groups = findVowelGroups(w);
  if (groups.length >= 2) {
    const last = groups[groups.length - 1];
    if (last.end === n && w[last.start] === 'e' && last.end - last.start === 1) {
      const prev = groups[groups.length - 2];
      const consBetween = last.start - prev.end;
      if (consBetween >= 1 && consBetween <= 2) groups.pop();
    }
  }
  if (groups.length <= 1) return [original];
  const cuts = [];
  for (let gi = 0; gi < groups.length - 1; gi++) {
    const a = groups[gi], b = groups[gi + 1];
    const consStart = a.end, consEnd = b.start;
    const consCount = consEnd - consStart;
    if (consCount <= 0) cuts.push(consStart);
    else if (consCount === 1) cuts.push(consStart);
    else if (consCount === 2) {
      const pair = w.slice(consStart, consEnd);
      if (SYL_DIGRAPHS.has(pair)) cuts.push(consStart);
      else cuts.push(consStart + 1);
    } else if (consCount === 3) {
      const first2 = w.slice(consStart, consStart + 2);
      const last2 = w.slice(consEnd - 2, consEnd);
      if (SYL_DIGRAPHS.has(first2)) cuts.push(consStart + 2);
      else if (SYL_DIGRAPHS.has(last2)) cuts.push(consStart + 1);
      else cuts.push(consStart + 2);
    } else cuts.push(consStart + 2);
  }
  const result = [];
  let prev = 0;
  for (const c of cuts) {
    if (c > prev) { result.push(original.slice(prev, c)); prev = c; }
  }
  if (prev < n) result.push(original.slice(prev));
  return result.filter(s => s);
}

function getSilentIndices(word) {
  const w = String(word || '').toLowerCase();
  if (SILENT_LETTERS_MAP[w]) return SILENT_LETTERS_MAP[w];
  const idx = [];
  if (/^kn/.test(w)) idx.push(0);
  if (/^wr/.test(w)) idx.push(0);
  if (/^ps/.test(w)) idx.push(0);
  if (/^gn/.test(w)) idx.push(0);
  if (w.length > 2 && /mb$/.test(w)) idx.push(w.length - 1);
  if (w.length > 2 && /mn$/.test(w)) idx.push(w.length - 1);
  if (w.length > 2 && /bt$/.test(w)) idx.push(w.length - 2);
  if (w.length > 2 && /gn$/.test(w)) idx.push(w.length - 2);
  return idx;
}

function renderSyllableWithSilent(syl, sylIndex, allSyllables, fullWord) {
  const silentSet = new Set(getSilentIndices(fullWord));
  if (silentSet.size === 0) return escapeHtml(syl);
  let startIdx = 0;
  for (let i = 0; i < sylIndex; i++) {
    startIdx += allSyllables[i].replace(/[^a-zA-Z]/g, '').length;
  }
  let html = '';
  let letterCount = 0;
  for (let i = 0; i < syl.length; i++) {
    const ch = syl[i];
    if (/[a-zA-Z]/.test(ch)) {
      if (silentSet.has(startIdx + letterCount)) {
        html += '<span class="silent-letter">' + escapeHtml(ch) + '</span>';
      } else html += escapeHtml(ch);
      letterCount++;
    } else html += escapeHtml(ch);
  }
  return html;
}

function renderSilentHint(word) {
  const idx = getSilentIndices(word);
  if (!idx.length) return '';
  const w = String(word).toLowerCase();
  const silentSet = new Set(idx);
  const chars = [];
  for (let i = 0; i < w.length; i++) {
    const ch = w[i];
    if (!/[a-zA-Z]/.test(ch)) { chars.push(escapeHtml(ch)); continue; }
    if (silentSet.has(i)) chars.push('<span class="silent-letter">' + escapeHtml(ch) + '</span>');
    else chars.push(escapeHtml(ch));
  }
  return `<div class="syl-silent-hint">🔇 不发音：${chars.join('')}</div>`;
}

/* 字段合并 */
function mergeMeaning(oldVal, newVal) {
  if (!newVal) return oldVal || '';
  if (!oldVal) return newVal;
  const parts = new Set();
  [oldVal, newVal].forEach(v => {
    String(v).split(/[;；]/).forEach(p => {
      const t = p.trim();
      if (t) parts.add(t);
    });
  });
  return Array.from(parts).join('；');
}
function mergePos(oldVal, newVal) {
  if (!newVal) return oldVal || '';
  if (!oldVal) return newVal;
  const parts = new Set();
  [oldVal, newVal].forEach(v => {
    String(v).split(/[\/，,、]/).forEach(p => {
      const t = p.trim();
      if (t) parts.add(t);
    });
  });
  return Array.from(parts).join('/');
}
function mergePhrases(oldList, newList) {
  const map = new Map();
  (oldList || []).forEach(p => {
    if (p && p.text) {
      const k = String(p.text).trim().toLowerCase();
      map.set(k, { text: p.text, meaning: p.meaning || '' });
    }
  });
  (newList || []).forEach(p => {
    if (p && p.text) {
      const k = String(p.text).trim().toLowerCase();
      if (!map.has(k)) map.set(k, { text: p.text, meaning: p.meaning || '' });
      else {
        const existing = map.get(k);
        if (p.meaning && !existing.meaning) existing.meaning = p.meaning;
      }
    }
  });
  return Array.from(map.values());
}

/* 状态管理 */
function buildInitialState() {
  const master = {};
  const wordIds = [];
  VOCAB.words.forEach(w => {
    const id = w.id || wordIdOf(w.word);
    master[id] = {
      id, word: w.word,
      pos: w.pos || '', meaning: w.meaning || '', ipa: w.ipa || '',
      syllables: Array.isArray(w.syllables) && w.syllables.length ? w.syllables : [w.word],
      phrases: Array.isArray(w.phrases) ? w.phrases : [],
      isPhrase: false
    };
    wordIds.push(id);
  });
  return {
    version: STATE_VERSION,
    settings: { ...DEFAULT_SETTINGS },
    master,
    lists: [{ id: 'list_exam', name: '中考考纲词汇',
      units: [{ id: 'unit_exam_all', name: '全部', wordIds }] }],
    activeListId: 'list_exam',
    activeUnitId: 'all',
    words: {}, sessions: {}, customSyllables: {},
    totalStudyDays: 0, lastStudyDate: null
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('wordplanet_v1');
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.version === STATE_VERSION) return s;
      return migrateState(s);
    }
  } catch (e) { console.warn(e); }
  return buildInitialState();
}
function migrateState(old) {
  const fresh = buildInitialState();
  if (!old) return fresh;
  if (old.words && typeof old.words === 'object') {
    Object.keys(old.words).forEach(id => {
      const w = old.words[id];
      if (w && typeof w === 'object') {
        fresh.words[id] = {
          stage: w.stage || 0, nextReview: w.nextReview || null,
          correct: w.correct || 0, wrong: w.wrong || 0,
          hint: typeof w.hint === 'number' ? w.hint : 3,
          learnedAt: w.learnedAt || dateStr(), lastSeen: w.lastSeen || dateStr(),
          totalEncounters: w.totalEncounters || (w.correct || 0) + (w.wrong || 0)
        };
      }
    });
  }
  if (old.customSyllables && typeof old.customSyllables === 'object') {
    Object.keys(old.customSyllables).forEach(id => {
      const v = old.customSyllables[id];
      if (Array.isArray(v) && v.length) fresh.customSyllables[id] = v;
    });
  }
  if (typeof old.totalStudyDays === 'number') fresh.totalStudyDays = old.totalStudyDays;
  else if (typeof old.streak === 'number') fresh.totalStudyDays = old.streak;
  if (old.lastStudyDate) fresh.lastStudyDate = old.lastStudyDate;
  if (old.settings && typeof old.settings === 'object') {
    if (old.settings.newPerDay) fresh.settings.newPerDay = old.settings.newPerDay;
    if (old.settings.reviewPerDay) fresh.settings.reviewPerDay = old.settings.reviewPerDay;
    if (old.settings.mode) fresh.settings.mode = old.settings.mode;
    if (typeof old.settings.globalReview === 'boolean') fresh.settings.globalReview = old.settings.globalReview;
  }
  if (Array.isArray(old.lists) && old.lists.length) {
    fresh.lists = old.lists;
    if (old.activeListId) fresh.activeListId = old.activeListId;
    if (old.activeUnitId) fresh.activeUnitId = old.activeUnitId;
  }
  if (old.master && typeof old.master === 'object') {
    Object.assign(fresh.master, old.master);
  }
  return fresh;
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn(e); }
}

function getCurrentList() { return state.lists.find(l => l.id === state.activeListId) || state.lists[0]; }
function getCurrentUnit() {
  const list = getCurrentList();
  if (!list) return null;
  if (state.activeUnitId === 'all') return null;
  return list.units.find(u => u.id === state.activeUnitId) || null;
}
function getCurrentWordIds() {
  const list = getCurrentList();
  if (!list) return [];
  const unit = getCurrentUnit();
  const ids = unit ? unit.wordIds : list.units.reduce((acc, u) => acc.concat(u.wordIds), []);
  return Array.from(new Set(ids));
}
function getSyllables(wordId) {
  const word = state.master[wordId];
  if (!word) return [];
  const custom = state.customSyllables && state.customSyllables[wordId];
  if (custom && Array.isArray(custom) && custom.length) return custom;
  return word.syllables || [word.word];
}
function getHintLevel(wordId) { const w = state.words[wordId]; return w && w.hint ? w.hint : 3; }
function isMastered(wordId) { const w = state.words[wordId]; return w && (w.stage || 0) >= EBBINGHAUS.length; }
function isLearned(wordId) { return !!state.words[wordId]; }
function getWordAssociations(wordId) {
  const result = [];
  state.lists.forEach(list => {
    list.units.forEach(unit => {
      if (unit.wordIds.includes(wordId)) result.push({ listName: list.name, unitName: unit.name });

function getCurrentListAccuracy() {
  const ids = getCurrentWordIds();
  let c = 0, t = 0;
  ids.forEach(id => {
    const w = state.words[id];
    if (w) { c += w.correct || 0; t += (w.correct || 0) + (w.wrong || 0); }
  });
  return t > 0 ? Math.round(c / t * 100) : 0;
}
function getGlobalAccuracy() {
  let c = 0, t = 0;
  Object.values(state.words).forEach(w => {
    c += w.correct || 0;
    t += (w.correct || 0) + (w.wrong || 0);
  });
  return t > 0 ? Math.round(c / t * 100) : 0;
}
function sessionKey() { return `${dateStr()}::${state.activeListId}::${state.activeUnitId}`; }
function ensureSessionFields(s) {
  if (!Array.isArray(s.newIds)) s.newIds = [];
  if (!Array.isArray(s.reviewIds)) s.reviewIds = [];
  if (!Array.isArray(s.learnDone)) s.learnDone = [];
  if (!Array.isArray(s.quizDone)) s.quizDone = [];
  if (typeof s.correct !== 'number') s.correct = 0;
  if (typeof s.total !== 'number') s.total = 0;
  return s;
}
function getTodaySession() {
  const key = sessionKey();
  if (!state.sessions[key]) {
    const { newIds, reviewIds } = buildTodayQueue();
    state.sessions[key] = {
      date: dateStr(), listId: state.activeListId, unitId: state.activeUnitId,
      newIds, reviewIds, correct: 0, total: 0, learnDone: [], quizDone: [], completed: false
    };
    saveState();
  }
  return ensureSessionFields(state.sessions[key]);
}
function buildTodayQueue() {
  const today = dateStr();
  const currentIds = getCurrentWordIds();
  let newLimit = state.settings.newPerDay, reviewLimit = state.settings.reviewPerDay;
  if (state.settings.mode === 'easy') {
    newLimit = Math.max(1, Math.ceil(newLimit / 2));
    reviewLimit = Math.max(1, Math.ceil(reviewLimit / 2));
  }
  const newIds = currentIds.filter(id => state.master[id] && !state.words[id]).slice(0, newLimit);
  const pool = state.settings.globalReview ? Object.keys(state.words) : currentIds.filter(id => state.words[id]);
  const dueIds = pool
    .filter(id => { const w = state.words[id]; return w && w.nextReview && w.nextReview <= today; })
    .sort((a, b) => (state.words[a].nextReview || '').localeCompare(state.words[b].nextReview || ''))
    .slice(0, reviewLimit);
  return { newIds, reviewIds: dueIds };
}
function resizeQueue(currentIds, doneIds, target, getPoolFn) {
  const doneSet = new Set(doneIds);
  const done = currentIds.filter(id => doneSet.has(id));
  const pending = currentIds.filter(id => !doneSet.has(id));
  const need = Math.max(0, target - done.length);
  if (pending.length >= need) return [...done, ...pending.slice(0, need)];
  const existing = new Set(currentIds);
  const pool = getPoolFn().filter(id => !existing.has(id));
  return [...done, ...pending, ...pool.slice(0, need - pending.length)];
}
function applyCurrentLimits() {
  const key = sessionKey();
  const session = state.sessions[key];
  if (!session) return;
  const factor = state.settings.mode === 'easy' ? 0.5 : 1;
  const targetNew = Math.max(1, Math.ceil(state.settings.newPerDay * factor));
  const targetReview = Math.max(1, Math.ceil(state.settings.reviewPerDay * factor));
  const currentIds = getCurrentWordIds();
  session.newIds = resizeQueue(session.newIds, session.learnDone || [], targetNew,
    () => currentIds.filter(id => state.master[id] && !state.words[id]));
  const today = dateStr();
  const pool = state.settings.globalReview ? Object.keys(state.words) : currentIds.filter(id => state.words[id]);
  session.reviewIds = resizeQueue(session.reviewIds, session.quizDone || [], targetReview,
    () => pool
      .filter(id => state.words[id] && state.words[id].nextReview && state.words[id].nextReview <= today)
      .sort((a, b) => (state.words[a].nextReview || '').localeCompare(state.words[b].nextReview || '')));
}
function updateWordProgress(wordId, correct) {
  const today = dateStr();
  let w = state.words[wordId];
  if (!w) {
    w = state.words[wordId] = { stage: 0, nextReview: null, correct: 0, wrong: 0, hint: 3, learnedAt: today, lastSeen: today, totalEncounters: 0 };
  }
  w.totalEncounters = (w.totalEncounters || 0) + 1;
  if (correct) {
    w.correct = (w.correct || 0) + 1;
    w.stage = Math.min((w.stage || 0) + 1, EBBINGHAUS.length);
    const days = EBBINGHAUS[Math.min(w.stage - 1, EBBINGHAUS.length - 1)] || 1;
    w.nextReview = dateOffset(days);
    w.hint = Math.max(1, (w.hint || 3) - 1);
  } else {
    w.wrong = (w.wrong || 0) + 1;
    w.stage = Math.max(0, (w.stage || 0) - 1);
    w.nextReview = dateOffset(1);
    w.hint = 3;
  }
  w.lastSeen = today;
  saveState();
}

/* 语音 */
let voices = [];
function loadVoices() { if (window.speechSynthesis) voices = speechSynthesis.getVoices(); }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate = 0.9) {
  if (!window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate; u.pitch = 1;
    const v = voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { console.warn(e); }
}
function speakWord(wordStr, rate = 0.85) { speak(String(wordStr).replace(/\./g, ' '), rate); }
function clearSyllableHighlight() { document.querySelectorAll('.syl-chip').forEach(el => el.classList.remove('syl-playing')); }
function highlightSyllable(index, duration = 500) {
  const chips = document.querySelectorAll('.syl-chip');
  if (!chips[index]) return;
  chips[index].classList.add('syl-playing');
  setTimeout(() => chips[index].classList.remove('syl-playing'), duration);
}
function playSyllableInWord(sylIndex) {
  if (screen !== 'learn') return;
  const wordId = learnQueue[learnIndex];
  if (!wordId) return;
  const word = state.master[wordId];
  if (!word) return;
  const syllables = getSyllables(wordId);
  if (!syllables.length) return;
  if (syllableTimer) clearTimeout(syllableTimer);
  clearSyllableHighlight();
  speakWord(word.word, 0.75);
  const letters = word.word.replace(/[^a-zA-Z]/g, '').length;
  const totalDuration = Math.max(900, letters * 95) / 0.75;
  const perSyl = totalDuration / syllables.length;
  syllableTimer = setTimeout(() => { highlightSyllable(sylIndex, Math.max(450, perSyl)); }, Math.max(60, sylIndex * perSyl));
}
function playSequentialSyllables() {
  if (screen !== 'learn') return;
  const wordId = learnQueue[learnIndex];
  if (!wordId) return;
  const word = state.master[wordId];
  if (!word) return;
  const syllables = getSyllables(wordId);
  if (!syllables.length) return;
  if (syllableTimer) clearTimeout(syllableTimer);
  clearSyllableHighlight();
  speakWord(word.word, 0.6);
  const letters = word.word.replace(/[^a-zA-Z]/g, '').length;
  const totalDuration = Math.max(1200, letters * 110) / 0.6;
  const perSyl = totalDuration / syllables.length;
  syllables.forEach((_, i) => {
    setTimeout(() => { clearSyllableHighlight(); highlightSyllable(i, Math.max(400, perSyl * 0.9)); }, i * perSyl + 60);
  });
}

function renderHintBoxes(word, level) {
  if (level <= 1) return '';
  const syllables = getSyllables(word.id);
  return syllables.map((syl, i) => {
    const letters = syl.split('').filter(c => /[a-zA-Z]/.test(c));
    if (letters.length === 0) return '';
    const slots = letters.map((ch, j) => {
      if (level >= 3 && j === 0) return `<span class="slot filled">${escapeHtml(ch)}</span>`;
      return `<span class="slot empty"></span>`;
    }).join('');
    return `<div class="hint-box syl-${i % 4}">${slots}</div>`;
  }).join('');
}

function renderChoiceQuiz(word) {
  const total = quizQueue.length;
  const progress = total > 0 ? (quizIndex / total * 100) : 0;
  const choices = buildChoices(word);
  return `

      </div>
    </div>
  `;

function buildChoices(word) {
  const correct = word.word;
  const pool = quizQueue.filter(id => id !== word.id).map(id => state.master[id])
    .filter(w => w && w.isPhrase === word.isPhrase && w.word !== correct).map(w => w.word);
  const unique = Array.from(new Set(pool));
  const shuffled = unique.sort(() => Math.random() - 0.5);
  const picks = shuffled.slice(0, 3);
  while (picks.length < 3) {
    const all = Object.values(state.master).filter(w => w.isPhrase === word.isPhrase && w.word !== correct).map(w => w.word);
    const extra = all.find(w => !picks.includes(w));
    if (!extra) break;
    picks.push(extra);
  }
  return [correct, ...picks].sort(() => Math.random() - 0.5);
}

/* 业务逻辑 */
function startLearning() {
  const session = getTodaySession();
  const pendingNew = session.newIds.filter(id => !session.learnDone.includes(id));
  const pendingQuiz = [...session.newIds, ...session.reviewIds].filter(id => !session.quizDone.includes(id));
  if (pendingNew.length > 0) {
    learnQueue = pendingNew; learnIndex = 0; screen = 'learn'; render();
  } else if (pendingQuiz.length > 0) beginQuiz();
  else enterDone();
}
function nextLearn() {
  const session = getTodaySession();
  const currentId = learnQueue[learnIndex];
  if (currentId && !session.learnDone.includes(currentId)) { session.learnDone.push(currentId); saveState(); }
  learnIndex++;
  if (learnIndex >= learnQueue.length) beginQuiz();
  else render();
}
function beginQuiz() {
  const session = getTodaySession();
  quizQueue = [...session.newIds, ...session.reviewIds].filter(id => !session.quizDone.includes(id));
  quizIndex = 0;
  if (quizQueue.length === 0) enterDone();
  else { screen = 'quiz'; render(); }
}
function enterDone() {
  const today = dateStr();
  if (state.lastStudyDate !== today) {
    state.totalStudyDays = (state.totalStudyDays || 0) + 1;
    state.lastStudyDate = today;
    saveState();
  }
  screen = 'done'; render();
}
function checkAnswer() {
  if (feedback) return;
  const inp = document.getElementById('answer-input');
  if (!inp) return;
  const value = normalize(inp.value);
  if (!value) return;
  const wordId = quizQueue[quizIndex];
  const word = state.master[wordId];
  if (!word) return;
  const correct = normalize(word.word);
  const session = getTodaySession();
  session.total += 1;
  if (value === correct) {
    session.correct += 1;
    if (!session.quizDone.includes(wordId)) session.quizDone.push(wordId);
    updateWordProgress(wordId, true);
    saveState();
    feedback = { type: 'correct', wordId };
    render();
    speakWord(word.word);
    feedbackTimer = setTimeout(() => {
      feedback = null; quizIndex++;
      if (quizIndex >= quizQueue.length) enterDone(); else render();
    }, 1400);
  } else {
    updateWordProgress(wordId, false);
    saveState();
    feedback = { type: 'wrong', wordId };
    render();
    feedbackTimer = setTimeout(() => {
      feedback = null; quizQueue.push(quizQueue[quizIndex]); quizIndex++; render();
    }, 2200);
  }
}
function checkChoiceAnswer(choice) {
  if (feedback) return;
  const wordId = quizQueue[quizIndex];
  const word = state.master[wordId];
  if (!word) return;
  const session = getTodaySession();
  session.total += 1;
  const isCorrect = choice === word.word;
  if (isCorrect) {
    session.correct += 1;
    if (!session.quizDone.includes(wordId)) session.quizDone.push(wordId);
    updateWordProgress(wordId, true);
    saveState();
    feedback = { type: 'correct', wordId };
    render();
    speakWord(word.word);
    feedbackTimer = setTimeout(() => {
      feedback = null; quizIndex++;
      if (quizIndex >= quizQueue.length) enterDone(); else render();
    }, 1400);
  } else {
    updateWordProgress(wordId, false);
    saveState();
    feedback = { type: 'wrong', wordId };
    render();
    feedbackTimer = setTimeout(() => {
      feedback = null; quizQueue.push(quizQueue[quizIndex]); quizIndex++; render();
    }, 2200);
  }
}
function goHome() {
  if (feedbackTimer) { clearTimeout(feedbackTimer); feedbackTimer = null; }
  if (syllableTimer) { clearTimeout(syllableTimer); syllableTimer = null; }
  clearSyllableHighlight();
  feedback = null; panel = null; editingWordId = null;
  screen = 'home'; render();
}
function switchList(listId, unitId) {
  state.activeListId = listId;
  state.activeUnitId = unitId || 'all';
  saveState(); panel = null; screen = 'home'; render();
}
function saveSyllableEdit(wordId) {
  const inp = document.getElementById('syl-edit-input');
  if (!inp) return;
  const raw = inp.value.trim();
  if (!raw) { alert('请输入音节'); return; }
  const parts = raw.split(/[-·\s,，]+/).map(s => s.trim()).filter(Boolean);
  if (parts.length === 0) { alert('请输入音节'); return; }
  if (!state.customSyllables) state.customSyllables = {};
  const word = state.master[wordId];
  const original = (word && word.syllables) ? word.syllables.join('-') : '';
  const current = parts.join('-');
  if (current === original) delete state.customSyllables[wordId];
  else state.customSyllables[wordId] = parts;
  saveState(); editingWordId = null; render();
}
function recalcAllSyllables() {
  const total = Object.keys(state.master).length;
  if (!confirm(`将用自然拼读规则重算 ${total} 个词的音节。\n\n· 你手动改过的词会保留\n· 其余词会覆盖\n\n确定继续吗？`)) return;
  let updated = 0, kept = 0;
  Object.keys(state.master).forEach(id => {
    if (state.customSyllables && state.customSyllables[id]) { kept++; return; }
    const w = state.master[id];
    if (!w) return;
    const newSyl = autoSyllabify(w.word);
    const oldSyl = w.syllables || [];
    if (JSON.stringify(newSyl) !== JSON.stringify(oldSyl)) { w.syllables = newSyl; updated++; }
  });
  saveState();
  alert(`✓ 完成！\n\n重算并更新：${updated} 个\n保留你手动改的：${kept} 个`);
  render();
}

/* 导入流程 */
function parseImportJson(json) {
  if (!json || typeof json !== 'object') throw new Error('JSON 格式错误');
  const listName = String(json.name || '未命名清单').trim();
  let unitDefs = [];
  if (Array.isArray(json.units) && json.units.length) {
    unitDefs = json.units.map(u => ({ name: String(u.name || '未命名单元').trim(), words: Array.isArray(u.words) ? u.words : [] }));
  } else if (Array.isArray(json.words)) {
    unitDefs = [{ name: '全部', words: json.words }];
  } else throw new Error('JSON 里找不到 words 或 units 数组');
  let totalWords = 0, newWords = 0, existingWords = 0;
  const seen = new Set();
  unitDefs.forEach(u => {
      // 跳过"全部"或"全部词"单元（界面自带"全部"已覆盖）
    if (u.name === '全部' || u.name === '全部词' || /^全部词[_\s]/.test(u.name)) {
      return;
    }
    u.words.forEach(item => {
      let wordStr;
      if (typeof item === 'string') wordStr = item.trim();
      else if (item && typeof item === 'object') wordStr = String(item.word || '').trim();
      if (!wordStr) return;
      const id = wordIdOf(wordStr);
      if (seen.has(id)) return;
      seen.add(id); totalWords++;
      if (state.master[id]) existingWords++; else newWords++;
    });
  });
  return { listName, unitDefs, stats: { totalWords, newWords, existingWords } };
}

function startParseImport() {
  try {
    let text;
    if (importTab === 'text') {
      const ta = document.getElementById('import-text');
      if (!ta || !ta.value.trim()) { alert('请粘贴 JSON 内容'); return; }
      text = ta.value.trim();
    } else {
      if (!importFileContent) { alert('请先选择文件'); return; }
      text = importFileContent;
    }
    const json = JSON.parse(text);
    pendingImport = parseImportJson(json);
    importTargetChoice = 'merge-same';
    const sameNameList = state.lists.find(l => l.name === pendingImport.listName);
    if (!sameNameList) importTargetChoice = 'new';
    importTargetListId = '';
    importNewName = pendingImport.listName;
    panel = 'import-confirm';
    render();
  } catch (e) {
    alert('JSON 解析失败：' + (e.message || e));
  }
}

function executeImport() {
  if (!pendingImport) return;
  const { listName, unitDefs } = pendingImport;
  let targetList = null;
  if (importTargetChoice === 'merge-same') {
    targetList = state.lists.find(l => l.name === listName);
    if (!targetList) { alert('同名清单不存在'); return; }
  } else if (importTargetChoice === 'merge-other') {
    if (!importTargetListId) { alert('请选择目标清单'); return; }
    targetList = state.lists.find(l => l.id === importTargetListId);
    if (!targetList) { alert('目标清单不存在'); return; }
  } else if (importTargetChoice === 'new') {
    if (!importNewName || !importNewName.trim()) { alert('请输入新清单名'); return; }
    targetList = { id: uid('list'), name: importNewName.trim(), units: [] };
    state.lists.push(targetList);
  }
  let addedCount = 0, mergedCount = 0, autoSylCount = 0, keptProgressCount = 0, renamedUnits = 0;
  unitDefs.forEach(u => {
    const wordIds = [];
    u.words.forEach(item => {
      let wordStr, extra = {};
      if (typeof item === 'string') wordStr = item.trim();
      else if (item && typeof item === 'object') { wordStr = String(item.word || '').trim(); extra = item; }
      if (!wordStr) return;
      const id = wordIdOf(wordStr);
      let syl;
      if (Array.isArray(extra.syllables) && extra.syllables.length) syl = extra.syllables;
      else { syl = autoSyllabify(wordStr); autoSylCount++; }
      if (!state.master[id]) {
        state.master[id] = {
          id, word: wordStr,
          pos: extra.pos || '', meaning: extra.meaning || '', ipa: extra.ipa || '',
          syllables: syl,
          phrases: Array.isArray(extra.phrases) ? extra.phrases : [],
          isPhrase: !!extra.isPhrase
        };
        addedCount++;
      } else {
        const existing = state.master[id];
        existing.meaning = mergeMeaning(existing.meaning, extra.meaning);
        existing.pos = mergePos(existing.pos, extra.pos);
        if (!existing.ipa && extra.ipa) existing.ipa = extra.ipa;
        if (Array.isArray(extra.syllables) && extra.syllables.length) {
          if (!state.customSyllables || !state.customSyllables[id]) existing.syllables = extra.syllables;
        }
        if (Array.isArray(extra.phrases) && extra.phrases.length) existing.phrases = mergePhrases(existing.phrases, extra.phrases);
        if (extra.isPhrase !== undefined) existing.isPhrase = !!extra.isPhrase;
        mergedCount++;
      }
      if (state.words[id]) keptProgressCount++;
      if (!wordIds.includes(id)) wordIds.push(id);
    });
    let unitName = u.name;
    if (unitName === '全部') { unitName = '全部词'; renamedUnits++; }
    let unit = targetList.units.find(x => x.name === unitName);
    if (!unit) { unit = { id: uid('unit'), name: unitName, wordIds: [] }; targetList.units.push(unit); }
    wordIds.forEach(id => { if (!unit.wordIds.includes(id)) unit.wordIds.push(id); });
  });
  saveState();
  const renameMsg = renamedUnits > 0 ? `\n单元"全部"→"全部词"：${renamedUnits} 个` : '';
  const msg = `✅ 导入成功！\n\n目标清单：${targetList.name}\n单元：${unitDefs.length} 个\n新增词汇：${addedCount} 个\n合并已有词汇：${mergedCount} 个\n自动拆分音节：${autoSylCount} 个\n保留进度的词：${keptProgressCount} 个${renameMsg}`;
  alert(msg);
  pendingImport = null;
  importFileContent = null; importFileName = '';
  panel = null;
  state.activeListId = targetList.id;
  state.activeUnitId = 'all';
  saveState();
  screen = 'home';
  render();
}

/* 事件 */
document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('panel-mask')) {
    if (panel) { panel = null; editingWordId = null; render(); }
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const arg = el.dataset.arg;
  switch (action) {
    case 'start': startLearning(); break;
    case 'back-home': goHome(); break;
    case 'learn-next': nextLearn(); break;
    case 'begin-quiz': beginQuiz(); break;
    case 'enter-done': enterDone(); break;
    case 'check': checkAnswer(); break;
    case 'choice-answer': checkChoiceAnswer(arg); break;
    case 'play-word':
      if (screen === 'learn' && learnQueue[learnIndex]) speakWord(state.master[learnQueue[learnIndex]].word, 0.85);
      break;
    case 'play-word-slow':
      if (screen === 'learn' && learnQueue[learnIndex]) speakWord(state.master[learnQueue[learnIndex]].word, 0.5);
      break;
    case 'play-sequential': playSequentialSyllables(); break;
    case 'play-syl': playSyllableInWord(parseInt(arg, 10)); break;
    case 'play-quiz-word':
      if (screen === 'quiz' && quizQueue[quizIndex]) speakWord(state.master[quizQueue[quizIndex]].word, 0.85);
      break;
    case 'open-settings': panel = 'settings'; render(); break;
    case 'open-stats': panel = 'stats'; render(); break;
    case 'open-syllables': panel = 'syllables'; sylSearch = ''; editingWordId = null; render(); break;
    case 'open-list-picker': panel = 'list-picker'; render(); break;
    case 'open-lists': panel = 'lists'; render(); break;
    case 'open-import': panel = 'import'; importTab = 'file'; importFileName = ''; importFileContent = null; pendingImport = null; render(); break;
    case 'close-panel': panel = null; editingWordId = null; render(); break;
    case 'export': {
      const data = JSON.stringify(state, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `单词星球备份_${dateStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      break;
    }
    case 'recalc-all-syl': recalcAllSyllables(); break;
    case 'choose-list': switchList(arg, 'all'); break;
    case 'choose-unit': state.activeUnitId = arg; saveState(); render(); break;
    case 'choose-unit-from-picker': {
      const [listId, unitId] = arg.split('|');
      switchList(listId, unitId);
      break;
    }
    case 'set-mode': {
      if (state.settings.mode === arg) break;
      state.settings.mode = arg; applyCurrentLimits(); saveState(); render();
      break;
    }
    case 'toggle-global-review': {
      state.settings.globalReview = !state.settings.globalReview;
      delete state.sessions[sessionKey()];
      saveState(); render();
      break;
    }
    case 'reset-today': {
      if (confirm('确定要重置今天的学习进度吗？')) {
        delete state.sessions[sessionKey()];
        saveState(); panel = null; screen = 'home'; render();
      }
      break;
    }
    case 'rename-list': {
      const list = state.lists.find(l => l.id === arg);
      if (!list) break;
      const name = prompt('输入新的清单名：', list.name);
      if (name && name.trim()) { list.name = name.trim(); saveState(); render(); }
      break;
    }
    case 'delete-list': {
      const list = state.lists.find(l => l.id === arg);
      if (!list) break;
      if (list.id === 'list_exam') { alert('默认清单不能删除'); break; }
      if (!confirm(`确定删除清单"${list.name}"吗？`)) break;
      state.lists = state.lists.filter(l => l.id !== arg);
      if (state.activeListId === arg) {
        state.activeListId = state.lists[0] ? state.lists[0].id : 'list_exam';
        state.activeUnitId = 'all';
      }
      saveState(); render();
      break;
    }
    case 'switch-import-tab':
      importTab = arg; importFileName = ''; importFileContent = null; render();
      break;
    case 'parse-import': startParseImport(); break;
    case 'choose-import-target': {
      if (arg === 'merge-same') {
        const sameName = state.lists.find(l => l.name === (pendingImport && pendingImport.listName));
        if (!sameName) return;
      }
      importTargetChoice = arg;
      const targetSel = document.getElementById('import-target-list');
      if (targetSel) importTargetListId = targetSel.value;
      const newInput = document.getElementById('import-new-name');
      if (newInput) importNewName = newInput.value;
      render();
      break;
    }
    case 'cancel-import': panel = 'import'; pendingImport = null; render(); break;
    case 'execute-import': executeImport(); break;
    case 'edit-syl':
      editingWordId = arg;
      {
        const listEl = document.getElementById('syl-list-container');
        if (listEl) listEl.innerHTML = renderSyllableList();
        else render();
      }
      requestAnimationFrame(() => {
        const inp = document.getElementById('syl-edit-input');
        if (inp) { inp.focus(); inp.select(); }
      });
      break;
    case 'cancel-edit-syl':
      editingWordId = null;
      {
        const listEl = document.getElementById('syl-list-container');
        if (listEl) listEl.innerHTML = renderSyllableList();
        else render();
      }
      break;
    case 'save-syl': saveSyllableEdit(arg); break;
    case 'reset-all-syl': {
      if (confirm('确定清空所有自定义音节吗？')) {
        state.customSyllables = {};
        saveState(); render();
      }
      break;
    }
  }
});

document.addEventListener('input', (e) => {
  let changed = false;
  if (e.target.id === 'slider-new') {
    const v = parseInt(e.target.value, 10);
    const el = document.getElementById('val-new');
    if (el) el.textContent = v + ' 个';
    state.settings.newPerDay = v; changed = true;
  }
  if (e.target.id === 'slider-review') {
    const v = parseInt(e.target.value, 10);
    const el = document.getElementById('val-review');
    if (el) el.textContent = v + ' 个';
    state.settings.reviewPerDay = v; changed = true;
  }
  if (changed) { applyCurrentLimits(); saveState(); }
  if (e.target.id === 'syl-search') {
    sylSearch = e.target.value;
    const listEl = document.getElementById('syl-list-container');
    if (listEl) listEl.innerHTML = renderSyllableList();
  }
  if (e.target.id === 'import-target-list') importTargetListId = e.target.value;
  if (e.target.id === 'import-new-name') importNewName = e.target.value;
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
    const file = e.target.files[0];
    importFileName = file.name;
    importFileContent = null;
    const reader = new FileReader();
    reader.onload = (ev) => {
      importFileContent = ev.target.result;
      const lbl = document.querySelector('label.file-input');
      if (lbl) lbl.textContent = '📄 ' + importFileName + '（已读取）';
    };
    reader.onerror = () => { alert('文件读取失败'); importFileName = ''; importFileContent = null; };
    reader.readAsText(file, 'utf-8');
  }
  if (e.target.id === 'import-target-list') importTargetListId = e.target.value;
  if (e.target.id === 'import-new-name') importNewName = e.target.value;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && screen === 'quiz' && !feedback) {
    const inp = document.getElementById('answer-input');
    if (inp && document.activeElement === inp) { e.preventDefault(); checkAnswer(); }
  }
  if (e.key === 'Enter' && editingWordId) {
    const inp = document.getElementById('syl-edit-input');
    if (inp && document.activeElement === inp) { e.preventDefault(); saveSyllableEdit(editingWordId); }
  }
  if (e.key === 'Escape' && panel) {
    panel = null; editingWordId = null; render();
  }
});

state = loadState();
autoFixDuplicateUnits();
saveState();
render();
</script>
</body>
</html>
